name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Real PostgreSQL + Valkey: lock-order/race cases that PGlite cannot interleave, and the
  # two-process cluster test (docs/design/spaces-at-scale.md "S0").
  cluster:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: enbox
          POSTGRES_PASSWORD: enbox
          POSTGRES_DB: enbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enbox" --health-interval 5s --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ['6379:6379']
    env:
      ENBOX_TEST_PG_URL: postgres://enbox:enbox@127.0.0.1:5432/postgres
      ENBOX_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @enbox/server -- test/pg test/cluster

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
