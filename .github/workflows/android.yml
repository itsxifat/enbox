name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Default server address baked into the app, e.g. https://chat.example.com (optional; it can also be set on the sign-in screen)'
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run check:native
      # `android/` is generated from app.json (Continuous Native Generation), never committed.
      - run: npx expo prebuild --platform android --clean --no-install
      # Phone CPUs only; add x86_64 for PC emulators.
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: enbox-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
