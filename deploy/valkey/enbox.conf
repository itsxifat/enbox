# Valkey for Enbox (merged into /etc/valkey/valkey.conf, or `include`d from it). It carries only
# the Socket.IO adapter and the cluster bus (pub/sub): nothing to persist, nothing to evict.
bind 127.0.0.1 -::1
port 6379
protected-mode yes
save ""
appendonly no
maxmemory 256mb
maxmemory-policy noeviction
# A subscriber that falls this far behind is disconnected (it reconnects and resyncs).
client-output-buffer-limit pubsub 64mb 16mb 60
