# The `enbox_app` upstream at the top of /etc/nginx/sites-available/enbox.conf (the location
# blocks in snippets/enbox-app.conf proxy to it). One `server` line per Enbox process
# (/etc/enbox/instances). Routing by client IP keeps one client's REST requests and sockets on
# one process: Socket.IO's long-polling fallback requires it, and per-process rate limits stay
# accurate. `consistent` hashing moves only the clients of an added/removed process; a process
# that is down (restart) is skipped and its clients reconnect to another one.
upstream enbox_app {
    hash $remote_addr consistent;
    server 127.0.0.1:4000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:4001 max_fails=1 fail_timeout=5s;
    keepalive 32;
}
