# Production-like stack: Enbox + PostgreSQL + Redis + coturn (TURN for calls).
# Usage: cp .env.example .env && edit secrets, then `docker compose up -d --build`.
services:
  enbox:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://enbox:${POSTGRES_PASSWORD:-enbox}@postgres:5432/enbox
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:-change-me-turn-secret}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - enbox-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enbox}
      POSTGRES_DB: enbox
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me-turn-secret}
      - --realm=enbox
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli

volumes:
  enbox-data:
  pg-data:
